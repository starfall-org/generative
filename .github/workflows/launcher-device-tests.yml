name: Launcher device test APKs

on:
  push:
    branches:
      - fix/launcher
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-device-test-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # ubuntu-latest already contains Android command-line tools. Avoid setup-android's
      # legacy `sdkmanager tools` install (the package no longer exists).
      - name: Install project Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER" || { echo 'Android sdkmanager not installed on runner'; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug app and instrumentation APK
        run: >
          ./gradlew --no-daemon --max-workers=2 --console=plain
          :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run targeted JVM regression tests
        run: >
          ./gradlew --no-daemon --max-workers=2 --console=plain
          :app:testDebugUnitTest
          --tests 'org.starfall.generative.extensions.launcher.*'
          --tests 'org.starfall.generative.features.settings.ui.Launcher*'
          --tests 'org.starfall.generative.features.providers.list.logic.ProvidersDemoDataTest'
          --tests 'org.starfall.generative.ProviderDrag*'
          --tests 'org.starfall.generative.ProviderDatabaseConflictTest'
          --tests 'org.starfall.generative.ChatGenerationTest'
          --tests 'org.starfall.generative.ChatActionsMediaRegressionTest'
          --tests 'org.starfall.generative.Immediate*'
          --tests 'org.starfall.generative.SidebarStorageTest'
          --tests 'org.starfall.generative.TemporaryConversationPersistenceTest'
          --tests 'org.starfall.generative.Phase4StorageTest'
          --tests 'org.starfall.generative.SpeechServiceStorageTest'
          --tests 'org.starfall.generative.FullBackupRestoreResilienceTest'
      - name: Upload app and instrumented test APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-device-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 3
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3
